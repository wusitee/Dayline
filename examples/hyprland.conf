# Dayline for hyprland.conf. Replace DAYLINE with the absolute path of the
# Dayline executable, for example /path/to/Dayline/.venv/bin/dayline.
# Super+N stays with SwayNC; Super+A toggles the panel; Super+T toggles the widget.
exec-once = DAYLINE ui
bind = SUPER, A, exec, DAYLINE ui toggle
bind = SUPER, T, exec, DAYLINE ui toggle-widget
