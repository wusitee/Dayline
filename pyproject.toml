[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dayline"
version = "0.2.0"
description = "A lightweight native agenda for Hyprland"
readme = "README.md"
requires-python = ">=3.11"
# The bridge and CLI use the standard library; native UI dependencies are separate.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
dayline = "dayline.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dayline = ["thunderbird/*.js", "thunderbird/*.json", "ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
